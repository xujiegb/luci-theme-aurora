name: LuCI Theme Aurora Build & Release

on:
  push:
    tags:
      - "v*"
    branches:
      - master
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build luci-theme-aurora ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      contains(github.event.head_commit.message, '[build]')
    strategy:
      fail-fast: false
      matrix:
        sdk: ["24.10.4", "25.12.5"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: slug
        run: echo "ref=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: eamonxg/build-luci-package@v2
        with:
          sdk: ${{ matrix.sdk }}
          packages: '[{"pkg":"luci-theme-aurora","path":"."}]'
      - uses: actions/upload-artifact@v6
        with:
          name: luci-theme-aurora-${{ steps.slug.outputs.ref }}-${{ steps.build.outputs.pkg_type }}
          path: out/*.[ai]pk
      - uses: eamonxg/build-luci-package/release@v2
        with:
          name: luci-theme-aurora
          files: out/*.[ai]pk
          body_repo: eamonxg/assets
          body_path: aurora/docs/theme/changelog/${{ github.ref_name }}.md
